name: Android

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate HACS custom repository
        uses: hacs/action@main
        with:
          category: integration
          comment: 'false'
          # This public Android project has not selected an open-source license.
          # Validate HACS custom-repository support, not default-catalog eligibility.
          ignore: 'license'
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r homeassistant/tests/requirements.txt
      - name: Home Assistant integration boundary tests
        run: python -m unittest discover -s homeassistant/tests -v
      - name: Compile integration
        run: python -m compileall -q custom_components/afterglow
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Regression tests
        run: ./tests/run.ps1 -JavaHome $env:JAVA_HOME
      - name: Build and lint
        run: ./gradlew.bat --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: Afterglow-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
